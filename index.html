<!DOCTYPE html>
<html>

<head>

    <title>Online Tic Tac Toe</title>

    <style>

        .board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 5px;
        }

        .cell {
            width: 80px;
            height: 80px;
            font-size: 30px;
        }

    </style>

</head>


<body>

    <h1>Tic Tac Toe</h1>


    <!-- CREATE GAME -->

    <h3>Create Game</h3>

    <button onclick="createGame()">
        Create Game
    </button>

    <p id="myId"></p>


    <hr>


    <!-- JOIN GAME -->

    <h3>Join Game</h3>

    <input
        type="text"
        id="friendId"
        placeholder="Enter Game ID"
    >

    <button onclick="joinGame()">
        Join Game
    </button>


    <p id="status">
        Create or join a game.
    </p>


    <hr>


    <!-- TURN -->

    <h3 id="turn">
        Waiting for players...
    </h3>


    <!-- BOARD -->

    <div class="board">

        <button class="cell" onclick="makeMove(0)"></button>
        <button class="cell" onclick="makeMove(1)"></button>
        <button class="cell" onclick="makeMove(2)"></button>

        <button class="cell" onclick="makeMove(3)"></button>
        <button class="cell" onclick="makeMove(4)"></button>
        <button class="cell" onclick="makeMove(5)"></button>

        <button class="cell" onclick="makeMove(6)"></button>
        <button class="cell" onclick="makeMove(7)"></button>
        <button class="cell" onclick="makeMove(8)"></button>

    </div>


    <br>


    <button onclick="restartGame()">
        Restart Game
    </button>


    <!-- PEERJS -->

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>


    <script>


        // =====================================================
        // VARIABLES
        // =====================================================

        let peer = null;

        let connection = null;

        let mySymbol = "";

        let currentPlayer = "X";

        let gameStarted = false;

        let gameOver = false;


        let board = [

            "",
            "",
            "",

            "",
            "",
            "",

            "",
            ""

        ];


        const cells =
            document.querySelectorAll(".cell");


        const winningPatterns = [

            [0, 1, 2],

            [3, 4, 5],

            [6, 7, 8],

            [0, 3, 6],

            [1, 4, 7],

            [2, 5, 8],

            [0, 4, 8],

            [2, 4, 6]

        ];


        // =====================================================
        // PEERJS CONFIGURATION
        // =====================================================

        const peerConfig = {

            config: {

                iceServers: [

                    {
                        urls: "stun:stun.l.google.com:19302"
                    },

                    {
                        urls: "stun:stun1.l.google.com:19302"
                    },

                    {
                        urls: "stun:stun2.l.google.com:19302"
                    },

                    {
                        urls: "stun:stun3.l.google.com:19302"
                    },

                    {
                        urls: "stun:stun4.l.google.com:19302"
                    }

                ]

            }

        };


        // =====================================================
        // CREATE GAME
        // =====================================================

        function createGame() {

            console.log("Creating game...");


            peer = new Peer(peerConfig);


            peer.on("open", function(id) {

                console.log("My Peer ID:", id);


                mySymbol = "X";


                document.getElementById("myId").textContent =
                    "Your Game ID: " + id;


                document.getElementById("status").textContent =
                    "You are Player X. Share this Game ID with Player O.";


                document.getElementById("turn").textContent =
                    "Waiting for Player O...";

            });


            // Player O connects

            peer.on("connection", function(conn) {

                console.log("Incoming connection received.");

                connection = conn;

                mySymbol = "X";

                setupConnection();

            });


            peer.on("error", function(error) {

                console.error("PEER ERROR:", error);


                document.getElementById("status").textContent =
                    "Peer error: " + error.type;

            });


            peer.on("disconnected", function() {

                console.log("Peer disconnected.");

                document.getElementById("status").textContent =
                    "Disconnected from PeerJS server.";

            });

        }


        // =====================================================
        // JOIN GAME
        // =====================================================

        function joinGame() {

            const friendId =
                document.getElementById("friendId").value.trim();


            if (friendId === "") {

                document.getElementById("status").textContent =
                    "Please enter a Game ID.";

                return;

            }


            console.log("Joining:", friendId);


            peer = new Peer(peerConfig);


            peer.on("open", function(myId) {

                console.log("My Peer ID:", myId);


                mySymbol = "O";


                document.getElementById("status").textContent =
                    "Connecting to Player X...";


                connection =
                    peer.connect(friendId, {

                        reliable: true

                    });


                setupConnection();

            });


            peer.on("error", function(error) {

                console.error("PEER ERROR:", error);


                document.getElementById("status").textContent =
                    "Peer error: " + error.type;

            });


            peer.on("disconnected", function() {

                console.log("Peer disconnected.");

            });

        }


        // =====================================================
        // CONNECTION SETUP
        // =====================================================

        function setupConnection() {

            if (!connection) {

                return;

            }


            console.log("Setting up connection...");


            connection.on("open", function() {

                console.log("DATA CONNECTION OPEN!");


                gameStarted = true;


                document.getElementById("status").textContent =
                    "Connected! You are Player " + mySymbol;


                updateTurn();

            });


            // =================================================
            // RECEIVE DATA
            // =================================================

            connection.on("data", function(data) {

                console.log("DATA RECEIVED:", data);


                // Receive game state

                if (data.type === "gameState") {

                    console.log("Updating board from other player.");


                    board = data.board;

                    currentPlayer =
                        data.currentPlayer;

                    gameOver =
                        data.gameOver;


                    updateBoard();


                    showGameResult();


                    updateTurn();

                }


                // Receive restart

                if (data.type === "restart") {

                    console.log("Restart received.");


                    board = [

                        "",
                        "",
                        "",

                        "",
                        "",
                        "",

                        "",
                        ""

                    ];


                    currentPlayer = "X";

                    gameOver = false;


                    updateBoard();


                    document.getElementById("status").textContent =
                        "Game restarted.";


                    updateTurn();

                }

            });


            // =================================================
            // CONNECTION CLOSE
            // =================================================

            connection.on("close", function() {

                console.log("Connection closed.");


                gameStarted = false;


                document.getElementById("status").textContent =
                    "The other player disconnected.";


                document.getElementById("turn").textContent =
                    "Waiting for player...";

            });


            // =================================================
            // CONNECTION ERROR
            // =================================================

            connection.on("error", function(error) {

                console.error(
                    "DATA CONNECTION ERROR:",
                    error
                );


                document.getElementById("status").textContent =
                    "Connection error. Check the browser console.";

            });

        }


        // =====================================================
        // MAKE MOVE
        // =====================================================

        function makeMove(position) {

            console.log(
                "Attempting move:",
                position
            );


            // Game hasn't started

            if (!gameStarted) {

                document.getElementById("status").textContent =
                    "Wait for the other player to join.";

                return;

            }


            // Game finished

            if (gameOver) {

                return;

            }


            // Not our turn

            if (currentPlayer !== mySymbol) {

                document.getElementById("status").textContent =
                    "Wait for your turn.";

                return;

            }


            // Cell already occupied

            if (board[position] !== "") {

                return;

            }


            // =================================================
            // MAKE MOVE
            // =================================================

            board[position] =
                mySymbol;


            console.log(
                "Board after move:",
                board
            );


            // Check winner

            checkWinner();


            // Change player if game continues

            if (!gameOver) {

                currentPlayer =
                    currentPlayer === "X"
                    ? "O"
                    : "X";

            }


            // Update our screen

            updateBoard();

            showGameResult();

            updateTurn();


            // =================================================
            // SEND TO OTHER PLAYER
            // =================================================

            if (
                connection &&
                connection.open
            ) {

                const gameState = {

                    type: "gameState",

                    board: board,

                    currentPlayer:
                        currentPlayer,

                    gameOver:
                        gameOver

                };


                console.log(
                    "SENDING:",
                    gameState
                );


                connection.send(gameState);


                console.log(
                    "SEND COMPLETE"
                );

            } else {

                console.error(
                    "Connection is not open!"
                );


                document.getElementById("status").textContent =
                    "Connection lost.";

            }

        }


        // =====================================================
        // UPDATE BOARD
        // =====================================================

        function updateBoard() {

            cells.forEach(function(cell, index) {

                cell.textContent =
                    board[index];

            });

        }


        // =====================================================
        // UPDATE TURN
        // =====================================================

        function updateTurn() {

            if (!gameStarted) {

                return;

            }


            if (gameOver) {

                return;

            }


            if (currentPlayer === mySymbol) {

                document.getElementById("turn").textContent =
                    "Your Turn (" + mySymbol + ")";

            } else {

                document.getElementById("turn").textContent =
                    "Player " + currentPlayer + "'s Turn";

            }

        }


        // =====================================================
        // CHECK WINNER
        // =====================================================

        function checkWinner() {

            for (
                let pattern of winningPatterns
            ) {

                const a =
                    board[pattern[0]];

                const b =
                    board[pattern[1]];

                const c =
                    board[pattern[2]];


                if (
                    a !== "" &&
                    a === b &&
                    b === c
                ) {

                    gameOver = true;

                    return;

                }

            }


            // Draw

            if (!board.includes("")) {

                gameOver = true;

            }

        }


        // =====================================================
        // SHOW RESULT
        // =====================================================

        function showGameResult() {

            for (
                let pattern of winningPatterns
            ) {

                const a =
                    board[pattern[0]];

                const b =
                    board[pattern[1]];

                const c =
                    board[pattern[2]];


                if (
                    a !== "" &&
                    a === b &&
                    b === c
                ) {

                    document.getElementById("status").textContent =
                        "Player " + a + " Wins!";

                    return;

                }

            }


            if (!board.includes("")) {

                document.getElementById("status").textContent =
                    "It's a Draw!";

            }

        }


        // =====================================================
        // RESTART GAME
        // =====================================================

        function restartGame() {

            if (!gameStarted) {

                return;

            }


            board = [

                "",
                "",
                "",

                "",
                "",
                "",

                "",
                ""

            ];


            currentPlayer = "X";

            gameOver = false;


            updateBoard();


            document.getElementById("status").textContent =
                "Game restarted.";


            updateTurn();


            // Send restart

            if (
                connection &&
                connection.open
            ) {

                connection.send({

                    type: "restart"

                });

            }

        }

    </script>

</body>

</html>
