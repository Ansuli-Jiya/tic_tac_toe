<!DOCTYPE html>
<html>
<head>
    <title>Online Tic Tac Toe</title>

    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 5px;
        }

        .cell {
            width: 80px;
            height: 80px;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <!-- CREATE GAME -->

    <h3>Create Game</h3>

    <button onclick="createGame()">Create Game</button>

    <p id="myId"></p>


    <hr>


    <!-- JOIN GAME -->

    <h3>Join Game</h3>

    <input
        type="text"
        id="friendId"
        placeholder="Enter Game ID"
    >

    <button onclick="joinGame()">Join Game</button>


    <p id="status">Create or join a game.</p>


    <hr>


    <!-- GAME -->

    <h3 id="turn">Waiting for players...</h3>


    <div class="board">

        <button class="cell" onclick="makeMove(0)"></button>
        <button class="cell" onclick="makeMove(1)"></button>
        <button class="cell" onclick="makeMove(2)"></button>

        <button class="cell" onclick="makeMove(3)"></button>
        <button class="cell" onclick="makeMove(4)"></button>
        <button class="cell" onclick="makeMove(5)"></button>

        <button class="cell" onclick="makeMove(6)"></button>
        <button class="cell" onclick="makeMove(7)"></button>
        <button class="cell" onclick="makeMove(8)"></button>

    </div>


    <br>

    <button onclick="restartGame()">Restart Game</button>


    <!-- PeerJS -->

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>


    <script>

        let peer;

        let connection;

        let mySymbol = "";

        let currentPlayer = "X";

        let gameStarted = false;

        let gameOver = false;


        // The 9 positions on the board

        let board = [
            "", "", "",
            "", "", "",
            "", "", ""
        ];


        // Winning combinations

        const winningPatterns = [

            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]

        ];


        // Get all cells

        const cells = document.querySelectorAll(".cell");


        // ==========================================
        // CREATE GAME
        // ==========================================

        function createGame() {

            peer = new Peer();


            peer.on("open", function(id) {

                mySymbol = "X";

                document.getElementById("myId").textContent =
                    "Your Game ID: " + id;

                document.getElementById("status").textContent =
                    "You are Player X. Share your Game ID with Player O.";

                document.getElementById("turn").textContent =
                    "Waiting for Player O...";

            });


            // Player O connects

            peer.on("connection", function(conn) {

                connection = conn;

                mySymbol = "X";

                gameStarted = true;

                document.getElementById("status").textContent =
                    "Player O connected!";

                updateTurn();

                setupConnection();

            });

        }


        // ==========================================
        // JOIN GAME
        // ==========================================

        function joinGame() {

            const friendId =
                document.getElementById("friendId").value.trim();


            if (friendId === "") {

                document.getElementById("status").textContent =
                    "Please enter a Game ID.";

                return;

            }


            peer = new Peer();


            peer.on("open", function() {

                mySymbol = "O";

                connection = peer.connect(friendId);

                setupConnection();

            });

        }


        // ==========================================
        // SETUP CONNECTION
        // ==========================================

        function setupConnection() {

            connection.on("open", function() {

                gameStarted = true;

                document.getElementById("status").textContent =
                    "Connected! You are Player " + mySymbol;

                updateTurn();

            });


            // Receive information from the other player

            connection.on("data", function(data) {

                // Receive a move

                if (data.type === "move") {

                    board[data.position] = data.symbol;

                    updateBoard();

                    currentPlayer = data.symbol === "X" ? "O" : "X";

                    checkWinner();

                    updateTurn();

                }


                // Receive restart

                if (data.type === "restart") {

                    resetBoard();

                }

            });

        }


        // ==========================================
        // MAKE MOVE
        // ==========================================

        function makeMove(position) {

            // Game not started

            if (!gameStarted) {

                return;

            }


            // Game already finished

            if (gameOver) {

                return;

            }


            // Not your turn

            if (currentPlayer !== mySymbol) {

                return;

            }


            // Cell already occupied

            if (board[position] !== "") {

                return;

            }


            // Add move

            board[position] = mySymbol;


            // Update our board

            updateBoard();


            // Send move to other player

            connection.send({

                type: "move",

                position: position,

                symbol: mySymbol

            });


            // Check winner

            checkWinner();


            // Change turn

            if (!gameOver) {

                currentPlayer =
                    currentPlayer === "X" ? "O" : "X";

                updateTurn();

            }

        }


        // ==========================================
        // UPDATE BOARD
        // ==========================================

        function updateBoard() {

            cells.forEach(function(cell, index) {

                cell.textContent = board[index];

            });

        }


        // ==========================================
        // UPDATE TURN
        // ==========================================

        function updateTurn() {

            if (!gameStarted) {

                return;

            }


            if (gameOver) {

                return;

            }


            if (currentPlayer === mySymbol) {

                document.getElementById("turn").textContent =
                    "Your Turn (" + mySymbol + ")";

            } else {

                document.getElementById("turn").textContent =
                    "Player " + currentPlayer + "'s Turn";

            }

        }


        // ==========================================
        // CHECK WINNER
        // ==========================================

        function checkWinner() {

            for (let pattern of winningPatterns) {

                let a = board[pattern[0]];

                let b = board[pattern[1]];

                let c = board[pattern[2]];


                if (
                    a !== "" &&
                    a === b &&
                    b === c
                ) {

                    document.getElementById("status").textContent =
                        "Player " + a + " Wins!";

                    gameOver = true;

                    return;

                }

            }


            // Check draw

            if (!board.includes("")) {

                document.getElementById("status").textContent =
                    "It's a Draw!";

                gameOver = true;

            }

        }


        // ==========================================
        // RESTART GAME
        // ==========================================

        function restartGame() {

            if (!gameStarted) {

                return;

            }


            resetBoard();


            // Tell the other player

            connection.send({

                type: "restart"

            });

        }


        // ==========================================
        // RESET BOARD
        // ==========================================

        function resetBoard() {

            board = [

                "", "", "",

                "", "", "",

                "", "", ""

            ];


            currentPlayer = "X";

            gameOver = false;


            updateBoard();


            document.getElementById("status").textContent =
                "Game restarted.";

            updateTurn();

        }

    </script>

</body>
</html>
