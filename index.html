<!DOCTYPE html>
<html>

<head>
    <title>Online Tic Tac Toe</title>

    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 5px;
        }

        .cell {
            width: 80px;
            height: 80px;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <h3>Create Game</h3>

    <button onclick="createGame()">Create Game</button>

    <p id="myId"></p>

    <hr>

    <h3>Join Game</h3>

    <input
        type="text"
        id="friendId"
        placeholder="Enter Game ID"
    >

    <button onclick="joinGame()">Join Game</button>

    <p id="status">Create or join a game.</p>

    <hr>

    <h3 id="turn">Waiting for players...</h3>

    <div class="board">

        <button class="cell" onclick="makeMove(0)"></button>
        <button class="cell" onclick="makeMove(1)"></button>
        <button class="cell" onclick="makeMove(2)"></button>

        <button class="cell" onclick="makeMove(3)"></button>
        <button class="cell" onclick="makeMove(4)"></button>
        <button class="cell" onclick="makeMove(5)"></button>

        <button class="cell" onclick="makeMove(6)"></button>
        <button class="cell" onclick="makeMove(7)"></button>
        <button class="cell" onclick="makeMove(8)"></button>

    </div>

    <br>

    <button onclick="restartGame()">Restart Game</button>


    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <script>

        let peer = null;
        let connection = null;

        let mySymbol = "";

        let currentPlayer = "X";

        let gameStarted = false;

        let gameOver = false;

        let board = [
            "", "", "",
            "", "", "",
            "", "", ""
        ];


        const cells = document.querySelectorAll(".cell");


        const winningPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]
        ];


        // ==================================================
        // CREATE GAME
        // ==================================================

        function createGame() {

            peer = new Peer({

                config: {

                    iceServers: [

                        {
                            urls: "stun:stun.l.google.com:19302"
                        },

                        {
                            urls: "stun:stun1.l.google.com:19302"
                        }

                    ]

                }

            });


            peer.on("open", function(id) {

                mySymbol = "X";

                document.getElementById("myId").textContent =
                    "Your Game ID: " + id;

                document.getElementById("status").textContent =
                    "You are X. Share this ID with Player O.";

                document.getElementById("turn").textContent =
                    "Waiting for Player O...";

            });


            peer.on("connection", function(conn) {

                connection = conn;

                setupConnection();

            });


            peer.on("error", function(error) {

                console.log("Peer error:", error);

                document.getElementById("status").textContent =
                    "Connection error: " + error.type;

            });

        }


        // ==================================================
        // JOIN GAME
        // ==================================================

        function joinGame() {

            const friendId =
                document.getElementById("friendId").value.trim();


            if (friendId === "") {

                document.getElementById("status").textContent =
                    "Enter a Game ID.";

                return;

            }


            peer = new Peer({

                config: {

                    iceServers: [

                        {
                            urls: "stun:stun.l.google.com:19302"
                        },

                        {
                            urls: "stun:stun1.l.google.com:19302"
                        }

                    ]

                }

            });


            peer.on("open", function() {

                mySymbol = "O";

                connection = peer.connect(

                    friendId,

                    {
                        reliable: true
                    }

                );


                setupConnection();

            });


            peer.on("error", function(error) {

                console.log("Peer error:", error);

                document.getElementById("status").textContent =
                    "Connection error: " + error.type;

            });

        }


        // ==================================================
        // CONNECTION
        // ==================================================

        function setupConnection() {

            connection.on("open", function() {

                gameStarted = true;

                document.getElementById("status").textContent =
                    "Connected! You are Player " + mySymbol;

                updateTurn();

            });


            connection.on("data", function(data) {

                console.log("Received:", data);


                // ------------------------------------------
                // RECEIVE MOVE
                // ------------------------------------------

                if (data.type === "move") {

                    receiveMove(
                        data.position,
                        data.symbol
                    );

                }


                // ------------------------------------------
                // RECEIVE RESTART
                // ------------------------------------------

                if (data.type === "restart") {

                    resetGame();

                }

            });


            connection.on("close", function() {

                gameStarted = false;

                document.getElementById("status").textContent =
                    "The other player disconnected.";

                document.getElementById("turn").textContent =
                    "Waiting for player...";

            });


            connection.on("error", function(error) {

                console.log("Connection error:", error);

                document.getElementById("status").textContent =
                    "Connection error.";

            });

        }


        // ==================================================
        // MAKE MOVE
        // ==================================================

        function makeMove(position) {

            if (!gameStarted) {

                return;

            }


            if (gameOver) {

                return;

            }


            if (currentPlayer !== mySymbol) {

                document.getElementById("status").textContent =
                    "It is not your turn.";

                return;

            }


            if (board[position] !== "") {

                return;

            }


            // Put player's symbol on board

            board[position] = mySymbol;


            updateBoard();


            // Check result

            const result = getGameResult();


            if (result === "X") {

                gameOver = true;

                document.getElementById("status").textContent =
                    "Player X Wins!";

            }

            else if (result === "O") {

                gameOver = true;

                document.getElementById("status").textContent =
                    "Player O Wins!";

            }

            else if (result === "draw") {

                gameOver = true;

                document.getElementById("status").textContent =
                    "It's a Draw!";

            }

            else {

                // Change turn

                currentPlayer =
                    currentPlayer === "X"
                    ? "O"
                    : "X";

                updateTurn();

            }


            // Send move to opponent

            if (connection && connection.open) {

                connection.send({

                    type: "move",

                    position: position,

                    symbol: mySymbol

                });

            }

        }


        // ==================================================
        // RECEIVE MOVE
        // ==================================================

        function receiveMove(position, symbol) {

            // Ignore invalid moves

            if (gameOver) {

                return;

            }


            if (board[position] !== "") {

                console.log("Invalid move received.");

                return;

            }


            // Make opponent's move

            board[position] = symbol;


            updateBoard();


            // Check result

            const result = getGameResult();


            if (result === "X") {

                gameOver = true;

                document.getElementById("status").textContent =
                    "Player X Wins!";

                return;

            }


            if (result === "O") {

                gameOver = true;

                document.getElementById("status").textContent =
                    "Player O Wins!";

                return;

            }


            if (result === "draw") {

                gameOver = true;

                document.getElementById("status").textContent =
                    "It's a Draw!";

                return;

            }


            // Change turn

            currentPlayer =
                currentPlayer === "X"
                ? "O"
                : "X";


            updateTurn();

        }


        // ==================================================
        // CHECK GAME RESULT
        // ==================================================

        function getGameResult() {

            // Check winning combinations

            for (let pattern of winningPatterns) {

                const a = board[pattern[0]];

                const b = board[pattern[1]];

                const c = board[pattern[2]];


                if (
                    a !== "" &&
                    a === b &&
                    b === c
                ) {

                    return a;

                }

            }


            // Check draw

            if (!board.includes("")) {

                return "draw";

            }


            // Game continues

            return null;

        }


        // ==================================================
        // UPDATE BOARD
        // ==================================================

        function updateBoard() {

            cells.forEach(function(cell, index) {

                cell.textContent = board[index];

            });

        }


        // ==================================================
        // UPDATE TURN
        // ==================================================

        function updateTurn() {

            if (!gameStarted) {

                return;

            }


            if (gameOver) {

                return;

            }


            if (currentPlayer === mySymbol) {

                document.getElementById("turn").textContent =
                    "Your Turn (" + mySymbol + ")";

            }

            else {

                document.getElementById("turn").textContent =
                    "Player " + currentPlayer + "'s Turn";

            }

        }


        // ==================================================
        // RESTART
        // ==================================================

        function restartGame() {

            if (!gameStarted) {

                return;

            }


            resetGame();


            if (connection && connection.open) {

                connection.send({

                    type: "restart"

                });

            }

        }


        // ==================================================
        // RESET
        // ==================================================

        function resetGame() {

            board = [

                "", "", "",

                "", "", "",

                "", "", ""

            ];


            currentPlayer = "X";

            gameOver = false;


            updateBoard();


            document.getElementById("status").textContent =
                "Game restarted.";


            updateTurn();

        }

    </script>

</body>

</html>
